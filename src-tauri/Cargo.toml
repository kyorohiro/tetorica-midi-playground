[package]
name = "tetorica-midi-playground"
version = "0.2.2"
edition = "2021"

[build-dependencies]
cc = "1"
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
midir = "0.11"

crossbeam-queue = "0.3"

[target.'cfg(target_os = "macos")'.dependencies]
cpal = "0.15.3"
